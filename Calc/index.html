<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Gustavo Braga Moura da Silva">
    <meta name="description" content="Calc with CSS, HTML and JavaScript">
    <link rel="stylesheet" href="style.css">
    <title></title>
</head>

<body>
    <div class="calc">

        <input type="text" disabled id="output" value="0">

        <div class="calc--tecla">
            <button class="btn btn-c" data-type="acao" data-value="C">C</button>
            <button class="btn btn-c" data-type="acao" data-value="±">±</button>
            <button class="btn btn-c" data-type="acao" data-value="%">%</button>
            <button class="btn" data-type="operator" data-value=":">:</button>
            <button class="btn" data-type="digito" data-value="7">7</button>
            <button class="btn" data-type="digito" data-value="8">8</button>
            <button class="btn" data-type="digito" data-value="9">9</button>
            <button class="btn" data-type="operator" data-value="x">x</button>
            <button class="btn" data-type="digito" data-value="4">4</button>
            <button class="btn" data-type="digito" data-value="5">5</button>
            <button class="btn" data-type="digito" data-value="6">6</button>
            <button class="btn" data-type="operator" data-value="-">-</button>
            <button class="btn" data-type="digito" data-value="1">1</button>
            <button class="btn" data-type="digito" data-value="2">2</button>
            <button class="btn" data-type="digito" data-value="3">3</button>
            <button class="btn" data-type="operator" data-value="+">+</button>
            <button class="btn" data-type="digito" data-value="0">0</button>
            <button class="btn" data-type="digito" data-value=".">.</button>
            <button class="btn" data-type="acao" data-value="=">=</button>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
